plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        "smooth_spellblade_compat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Exact modern stack used by Smooth Odyssey.
    modImplementation "maven.modrinth:spell-engine:1.10.7+1.20.1-fabric"
    modImplementation "maven.modrinth:spell-power:1.6.0+1.20.1-fabric"
    modImplementation "maven.modrinth:trinkets:3.7.2"

    // Spellblades itself is intentionally NOT on the compile classpath.
    // All references to Spellblades classes are string-based @Pseudo mixin targets,
    // so the compat project can build independently while fabric.mod.json requires
    // the real Spellblades jar at runtime.
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(targetJavaVersion)
}
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") { rename { "LICENSE_${project.archives_base_name}.txt" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Spellblades 2.4.0 ships this unassigned draft without registering its effect.
// Preserve its source, but do not promote it into the modern active spell registry.
tasks.named('processResources') { exclude 'data/spellbladenext/spell/bulwark.json' }

tasks.register('validateMigratedSpellAssignments') {
    def resources = file('src/main/resources/data/spellbladenext')
    inputs.dir(resources)
    doLast {
        fileTree(resources).matching { include '**/*.json'; exclude 'spell/bulwark.json' }.files.each { source ->
            if (source.text.contains('"spellbladenext:bulwark"')) {
                throw new GradleException('Unimplemented upstream Bulwark assigned by ' + source)
            }
        }
    }
}
tasks.named('processResources') { dependsOn 'validateMigratedSpellAssignments' }

tasks.register('verifyMigratedSpellJar') {
    dependsOn 'remapJar'
    doLast {
        new java.util.jar.JarFile(tasks.named('remapJar').get().archiveFile.get().asFile).withCloseable { jar ->
            if (jar.getJarEntry('data/spellbladenext/spell/bulwark.json') != null) {
                throw new GradleException('Unimplemented Bulwark draft leaked into active migrated data')
            }
        }
        logger.lifecycle('Verified active migration excludes the unassigned upstream Bulwark draft; source retained')
    }
}
tasks.named('check') { dependsOn 'verifyMigratedSpellJar' }
